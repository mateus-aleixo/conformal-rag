[project]
name = "conformal-rag"
version = "0.1.0"
description = "RAG over industrial maintenance manuals with conformal abstention: answers carry a calibrated error guarantee, or the system declines."
authors = [{ name = "Mateus Filipe Aleixo", email = "mateusfilipealeixo@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pypdf>=4.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/mateus-aleixo/conformal-rag"
Sibling = "https://github.com/mateus-aleixo/conformal-rul"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformal_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
